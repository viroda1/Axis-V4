<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>Axis V4</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js" defer></script>
<script type="module">import*as BareMux from"https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs";window.BareMux=BareMux;</script>
<script src="script.js" defer></script>
</head>
<body>
<video id="theme-video" autoplay muted loop playsinline></video>
<div id="theme-overlay"></div>
<div id="app">
  <div class="tabs" id="tabs"></div>
  <div class="nav" id="nav">
    <button id="back-btn" title="Back" disabled><i class="fa-solid fa-chevron-left"></i></button>
    <button id="forward-btn" title="Forward" disabled><i class="fa-solid fa-chevron-right"></i></button>
    <button id="refresh-btn" title="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
    <div class="address-wrapper">
      <span class="address-icon" id="address-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
      <input class="bar" id="address-bar" type="text" placeholder="Search or enter URL" autocomplete="off" spellcheck="false">
      <button id="home-btn-nav" title="Home"><i class="fa-solid fa-house"></i></button>
    </div>
    <button id="settings-btn" title="Settings"><i class="fa-solid fa-gear"></i></button>
  </div>
  <div class="loading-bar-container"><div class="loading-bar" id="loading-bar"></div></div>
  <div class="iframe-container" id="iframe-container"></div>
</div>
<div class="modal-overlay hidden" id="settings-modal">
  <div class="modal-card">
    <div class="modal-header">
      <h2><svg class="modal-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 6 L20 6 L12 12 Z"/><path d="M4 18 L20 18 L12 12 Z"/></svg> Axis V4</h2>
      <button class="close-btn" id="close-settings"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="settings-body"></div>
    <div class="modal-footer">Axis V4 &middot; Built for speed</div>
  </div>
</div>
<div class="modal-overlay hidden" id="redeem-modal">
  <div class="modal-card redeem-card">
    <div class="modal-header">
      <h2><i class="fa-solid fa-bolt" style="color:var(--accent)"></i> Redeem Code</h2>
      <button class="close-btn" id="close-redeem"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <p class="redeem-desc">Enter a valid Axis V4 code to unlock premium optimizations.</p>
      <div class="input-row">
        <input type="text" id="redeem-input" placeholder="AXIS-V4-PRO" autocomplete="off" spellcheck="false">
        <button id="apply-redeem">Unlock</button>
      </div>
      <div id="redeem-status"></div>
    </div>
  </div>
</div>
</body>
</html>
