<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axis V4 — New Tab</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
:root{--bg:#09090b;--surface:#111113;--border:#1c1c20;--text:#e4e4e7;--text-sec:#a1a1aa;--text-muted:#63636e;--text-dim:#3f3f46;--accent:#ef4444;--r-lg:12px;--r-md:8px;--ease:cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
body{min-height:100vh;display:flex;justify-content:center}
.bg-orb{position:fixed;width:500px;height:500px;border-radius:50%;background:var(--accent);opacity:.02;filter:blur(120px);pointer-events:none;z-index:0;top:18%;left:50%;transform:translate(-50%,-50%);animation:drift 25s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(-50%,-50%) scale(1)}33%{transform:translate(-40%,-60%) scale(1.15)}66%{transform:translate(-60%,-40%) scale(.9)}}
.nt{width:min(100%,960px);min-height:100vh;padding:40px 24px 28px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:9px;color:var(--text-dim);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.brand-logo{width:26px;height:26px;color:var(--accent)}
.axis-logo path{fill:currentColor}
.greeting{margin-top:68px;font-size:clamp(17px,2.8vw,21px);font-weight:500;color:var(--text-sec);letter-spacing:-.01em}
.clock{margin-top:10px;font-size:clamp(56px,13vw,108px);font-weight:600;letter-spacing:-.06em;line-height:1;background:linear-gradient(180deg,var(--text) 30%,var(--text-muted) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.date{margin-top:10px;color:var(--text-muted);font-size:14px}
.search-wrap{width:min(600px,100%);margin-top:38px;position:relative}
.search{display:flex;gap:2px;padding:5px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);transition:border-color .2s,box-shadow .2s}
.search-wrap:focus-within .search{border-color:var(--border);box-shadow:0 0 0 3px rgba(239,68,68,.05)}
.search-wrap .s-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:13px;pointer-events:none;transition:color .2s}
.search-wrap:focus-within .s-icon{color:var(--text-muted)}
.search select{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.search input{flex:1;min-width:0;height:38px;padding:0 82px 0 38px;background:transparent;border:none;outline:none;color:var(--text);font-size:13.5px;font-family:inherit}
.search input::placeholder{color:var(--text-dim)}
.search button{width:38px;border:none;border-radius:calc(var(--r-lg) - 4px);background:var(--accent);color:#fff;cursor:pointer;font-size:13px;transition:filter .15s,transform .1s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.search button:hover{filter:brightness(1.1)}
.search button:active{transform:scale(.95)}
.eng-toggle{position:absolute;right:48px;top:50%;transform:translateY(-50%);padding:4px 8px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:10.5px;font-family:inherit;border-radius:var(--r-md);transition:all .15s;white-space:nowrap;font-weight:500}
.eng-toggle:hover{color:var(--text-sec);background:rgba(255,255,255,.04)}
.shortcuts{width:min(660px,100%);margin-top:34px;display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.shortcut{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 12px;border-radius:var(--r-lg);color:var(--text-muted);text-decoration:none;transition:all .2s var(--ease);border:1px solid transparent}
.shortcut:hover{color:var(--text);background:var(--surface);border-color:var(--border);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.25)}
.shortcut:active{transform:translateY(-1px)}
.shortcut img{width:26px;height:26px;border-radius:6px;transition:transform .2s}
.shortcut:hover img{transform:scale(1.1)}
.shortcut span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-weight:500}
.footer-actions{margin-top:auto;padding-top:40px}
.redeem-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border:1px solid var(--border);border-radius:var(--r-md);background:transparent;color:var(--text-dim);cursor:pointer;font:inherit;font-size:11.5px;transition:all .2s}
.redeem-btn:hover{color:var(--text-sec);border-color:var(--accent);background:rgba(239,68,68,.04)}
@media(max-width:800px){.shortcuts{grid-template-columns:repeat(5,1fr)}}
@media(max-width:480px){.nt{padding-top:28px}.greeting{margin-top:52px}.search-wrap{margin-top:30px}.shortcuts{grid-template-columns:repeat(3,1fr);gap:6px}.shortcut{padding:12px 4px 10px}}
</style>
</head>
<body>
<div class="bg-orb"></div>
<main class="nt">
<div class="brand"><svg class="brand-logo axis-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 6 L20 6 L12 12 Z"/><path d="M4 18 L20 18 L12 12 Z"/></svg><span>AXIS V4</span></div>
<div class="greeting" id="greeting"></div>
<div class="clock" id="clock">12:00 AM</div>
<div class="date" id="date"></div>
<div class="search-wrap">
  <i class="fa-solid fa-magnifying-glass s-icon"></i>
  <form class="search" id="searchForm">
    <select id="engine" aria-label="Search engine">
      <option value="https://search.brave.com/search?q=">Brave</option>
      <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
      <option value="https://www.google.com/search?q=">Google</option>
      <option value="https://www.bing.com/search?q=">Bing</option>
    </select>
    <input id="query" autocomplete="off" placeholder="Search the web">
    <button class="eng-toggle" id="engBtn" type="button">Brave</button>
    <button type="submit" aria-label="Search"><i class="fa-solid fa-arrow-right"></i></button>
  </form>
</div>
<div class="shortcuts" id="shortcuts"></div>
<div class="footer-actions"><button class="redeem-btn" id="redeemBtn"><i class="fa-solid fa-bolt"></i> Redeem Code</button></div>
</main>
<script>
const shortcuts=[
  ['YouTube','youtube','https://youtube.com'],['GitHub','github','https://github.com'],
  ['Discord','discord','https://discord.com'],['Twitter','x','https://x.com'],
  ['Reddit','reddit','https://reddit.com'],['Spotify','spotify','https://spotify.com'],
  ['Netflix','netflix','https://netflix.com'],['Twitch','twitch','https://twitch.tv'],
  ['Gmail','gmail','https://mail.google.com']
];
const root=document.getElementById('shortcuts');
shortcuts.forEach(([name,icon,url])=>{
  const a=document.createElement('a');a.className='shortcut';a.href=url;a.target='_blank';a.rel='noopener';
  a.innerHTML=`<img src="https://cdn.simpleicons.org/${icon}" alt=""><span>${name}</span>`;
  a.addEventListener('click',e=>{e.preventDefault();window.parent.postMessage({type:'navigate',url},'*')});
  root.appendChild(a);
});
const engines=[['Brave','https://search.brave.com/search?q='],['DuckDuckGo','https://duckduckgo.com/?q='],['Google','https://www.google.com/search?q='],['Bing','https://www.bing.com/search?q=']];
let engIdx=0;
const engSel=document.getElementById('engine'),engBtn=document.getElementById('engBtn');
engBtn.addEventListener('click',()=>{engIdx=(engIdx+1)%engines.length;engSel.value=engines[engIdx][1];engBtn.textContent=engines[engIdx][0]});

function greeting(){
  const h=new Date().getHours();
  if(h>=5&&h<12) return 'Good morning';
  if(h>=12&&h<17) return 'Good afternoon';
  if(h>=17&&h<21) return 'Good evening';
  return 'Good night';
}
function tick(){
  const n=new Date();
  document.getElementById('clock').textContent=n.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
  document.getElementById('date').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  document.getElementById('greeting').textContent=greeting();
}
tick();setInterval(tick,1000);
document.getElementById('searchForm').addEventListener('submit',e=>{
  e.preventDefault();const q=document.getElementById('query').value.trim();
  if(q) window.parent.postMessage({type:'navigate',url:engSel.value+encodeURIComponent(q)},'*');
});
document.getElementById('redeemBtn').addEventListener('click',()=>window.parent.postMessage({type:'openRedeem'},'*'));
</script>
</body>
</html>
