<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axis V4 — Embed</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js" defer></script>
<script type="module">import*as BareMux from"https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs";window.BareMux=BareMux;</script>
<style>
:root{--bg:#09090b;--surface:#111113;--border:#1c1c20;--text:#e4e4e7;--muted:#63636e;--accent:#ef4444}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
#iframe-container{position:absolute;inset:0;z-index:1;will-change:filter;transform:translateZ(0)}
#embed-frame{width:100%;height:100%;border:0;background:transparent}
.msg{display:flex;align-items:center;justify-content:center;width:100%;height:100%;position:fixed;inset:0;z-index:10;background:rgba(9,9,11,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-align:center}
.msg-inner{max-width:380px;padding:20px}
.ax-logo{width:42px;height:42px;margin:0 auto 16px;color:var(--text)}.ax-logo path{fill:currentColor}
.msg-inner h1{font-size:1.15rem;font-weight:600;margin:0 0 8px}
.msg-inner p{color:var(--muted);font-size:12.5px;word-break:break-all;line-height:1.5}
.spin{width:30px;height:30px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
.msg button{margin-top:16px;padding:7px 16px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:7px;cursor:pointer;font:inherit;font-size:12.5px;transition:all .15s}
.msg button:hover{color:var(--text);border-color:var(--accent)}
body.axis-premium #iframe-container{filter:none!important}
body.axis-premium .msg{backdrop-filter:none!important;background:var(--bg)!important}
</style>
</head>
<body>
<div id="loading" class="msg"><div class="msg-inner">
<svg class="ax-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 6 L20 6 L12 12 Z"/><path d="M4 18 L20 18 L12 12 Z"/></svg>
<div class="spin"></div>
<h1 id="ltitle">Connecting</h1>
<p id="lurl">Initializing Axis proxy...</p>
<button id="skip-btn">Skip</button>
</div></div>
<div id="error" class="msg" style="display:none"><div class="msg-inner">
<svg class="ax-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 6 L20 6 L12 12 Z"/><path d="M4 18 L20 18 L12 12 Z"/></svg>
<h1>Connection Error</h1>
<p id="emsg"></p>
<button id="retry-btn">Retry</button>
</div></div>
<div id="iframe-container"></div>
<script>
const DW=window.SITE_CONFIG?.defaultWisp||"wss://glseries.net/wisp/";
const $=id=>document.getElementById(id);
const els={loading:$('loading'),title:$('ltitle'),url:$('lurl'),error:$('error'),emsg:$('emsg'),container:$('iframe-container'),skip:$('skip-btn')};
if(localStorage.getItem('axisPremium')==='true')document.body.classList.add('axis-premium');
let sj=null,conn=null;
const base=()=>location.pathname.replace(/[^/]*$/,'')||'/';
function showError(m){els.loading.style.display='none';els.error.style.display='flex';els.emsg.textContent=m}
function validUrl(u){try{const x=new URL(u);return x.protocol==='http:'||x.protocol==='https:'}catch{return false}}
async function initSJ(){
  if(window.__axisSJ){sj=window.__axisSJ;return sj}
  if(sj)return sj;
  if(!window.$scramjetLoadController)throw new Error('scramjet unavailable');
  sj=new (await window.$scramjetLoadController())({prefix:base()+'scramjet/',files:{wasm:'https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.wasm.wasm',all:'https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js',sync:'https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.sync.js'}});
  try{await sj.init()}catch(e){if(/IDBDatabase|object stores|IndexedDB/i.test(e?.message||'')){try{for(const n of['scramjet-data','scrambase','ScramjetData'])await new Promise(r=>{const q=indexedDB.deleteDatabase(n);q.onsuccess=q.onerror=q.onblocked=r})}catch{}await sj.init()}else throw e}
  window.__axisSJ=sj;return sj;
}
async function initConn(){
  if(window.__axisBM){conn=window.__axisBM;return conn}
  if(conn)return conn;
  const B=window.BareMux;if(!B?.BareMuxConnection)throw new Error('BareMux unavailable');
  const w=localStorage.getItem('proxServer')||DW;
  conn=new B.BareMuxConnection(base()+'bareworker.js');
  await conn.setTransport('https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@2.1.28/dist/index.mjs',[{wisp:w}]);
  window.__axisBM=conn;return conn;
}
async function regSW(){
  if(!('serviceWorker'in navigator))return;
  try{
    const reg=await navigator.serviceWorker.register(base()+'sw.js',{scope:base()});
    await navigator.serviceWorker.ready;
    const cfg={type:'config',wispurl:localStorage.getItem('proxServer')||DW,servers:[{name:'GLSeries',url:DW},...JSON.parse(localStorage.getItem('customWisps')||'[]')],autoswitch:localStorage.getItem('wispAutoswitch')!=='false'};
    navigator.serviceWorker.controller?.postMessage(cfg);reg.active?.postMessage(cfg);
  }catch(e){console.warn('SW:',e)}
}
async function init(){
  const target=decodeURIComponent(location.hash.slice(1));
  if(!target){showError('No URL supplied.');return}
  if(!validUrl(target)){showError('Invalid URL.');return}
  try{
    els.url.textContent=target;
    await regSW();
    const[sj]=await Promise.all([initSJ(),initConn()]);
    els.title.textContent='Loading Site';
    const frame=sj.createFrame();frame.frame.id='embed-frame';els.container.appendChild(frame.frame);
    frame.frame.addEventListener('load',()=>{
      els.loading.style.opacity='0';els.loading.style.visibility='hidden';
      setTimeout(()=>els.loading.style.display='none',200);
      try{window.parent.postMessage({type:'loaded',title:frame.frame.contentDocument?.title||''},'*')}catch{}
    });
    els.skip.onclick=()=>{els.loading.style.display='none'};
    setTimeout(()=>els.skip.style.display='inline-block',2000);
    frame.go(target);
  }catch(e){console.error(e);showError(e?.message||'Unable to initialize proxy.')}
}
 $('retry-btn').onclick=()=>location.reload();
window.addEventListener('load',init);
</script>
</body>
</html>
